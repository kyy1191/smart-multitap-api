                    setEditingPort(null);
                    return;

                            ...strip,
                            ports: strip.ports.map(p => p.id === portId ? { ...p, name: newName.trim() } : p)

                        device_id: `multitap_${Date.now()}`,
                        name: '멀티탭 1',
                        room: trimmedRoom,
                        ports: [

                const isOnline = navigator.onLine;
                setWifiConnected(isOnline);
                if (!isOnline) setWifiDisconnectTime(Date.now());

                const handleOnline = () => {
                    console.log('[Wi-Fi] 인터넷 연결됨');
                    setWifiConnected(true);
                    setWifiDisconnectTime(null);
                    handleWifiChange(true, currentSSID);
                };
                const handleOffline = () => {
                    console.log('[Wi-Fi] 인터넷 연결 끊김');
                    setWifiConnected(false);
                    setWifiDisconnectTime(Date.now());
                    handleWifiChange(false, currentSSID);
                };

                window.addEventListener('online', handleOnline);
                window.addEventListener('offline', handleOffline);
                return () => {
                    window.removeEventListener('online', handleOnline);
                    window.removeEventListener('offline', handleOffline);
                };
            }, []);
            // 1. 처음에 데이터 가져오고, 3초마다 반복 (API 연동 부활!)
            // 1. 처음에 데이터 가져오고 + 🌐 와이파이 초기 상태 서버에 즉시 동기화!
            // 1. 처음에 데이터 가져오고 + 🌐 와이파이 초기 상태 서버에 즉시 동기화!
            useEffect(() => {
                // 초기화할 시간을 0.5초 준 뒤, 데이터를 불러오기 시작합니다.
                setTimeout(() => {
                    loadData();
                    fetchEsgReport();
                    handleWifiChange(navigator.onLine, currentSSID);
                }, 500);

                // 3초마다 센서 데이터 폴링을 10초로 연장하고, 주력은 실시간 웹소켓 연동
                const timer = setInterval(loadData, 10000);
                
                let ws;
                const connectWebSocket = () => {
                    ws = new WebSocket("wss://smart-multitap-api.onrender.com/ws");
                    ws.onopen = () => console.log("[WS] 실시간 서버 연결 성공!");
                    ws.onmessage = (event) => {
                        try {
                            const message = JSON.parse(event.data);
                            if (message.event === "sensor_upload" || message.event === "broadcast") {
                                const sensor = message.data;
                                setStrips(prev => prev.map(strip => ({
                                    ...strip,
                                    ports: strip.ports.map(port => {
                                        if (strip.device_id === sensor.device_id && port.id === sensor.port_number) {
                                            const isLocked = window.toggleLock && window.toggleLock[port.id] && (Date.now() - window.toggleLock[port.id] < 1500);
                                            const powerVal = parseFloat(sensor.power) || 0;
                                            const isOnByPower = powerVal > POWER_ON_THRESHOLD_W;
                                            const isOn = isLocked ? (port.status === 'On') : isOnByPower;

                                            let newContinuous = port.continuousUsage || 0;
                                            if (!isOn || (isOn && port.status === 'Off')) newContinuous = 0;

                                            return {
                                                ...port,
                                                voltage: isOn ? `${sensor.voltage} V` : '0 V',
                                                current: isOn ? `${sensor.current} A` : '0 A',
                                                power: isOn ? `${sensor.power} W` : '0 W',
                                                standbyPower: !isOn ? `${Math.round(powerVal * 1000)} mW` : '0 mW',
                                                temperature: `${sensor.temperature} °C`,
                                                status: isOn ? "On" : "Off",
                                                continuousUsage: newContinuous
                                            };
                                        }
                                        return port;
                                    })
                                })));
                            }
                        } catch(e) {}
                    };
                    ws.onclose = () => {
                        setTimeout(connectWebSocket, 3000);
                    };
                };
                connectWebSocket();

                return () => {
                    clearInterval(timer);
                    if (ws) ws.close();
                };
            }, []);

            // 2. 1분마다 사용 시간 올려주기
            // 2️⃣ 1분마다 기기 사용 시간 체크 + ⏰ 스케줄 시간에 맞춰 "실제 기기" 자동으로 켜고 끄기!
            // 2️⃣ 사용 시간 기록용 타이머 (1분마다 동작)
            // 2️⃣ 사용 시간 기록용 타이머 (1분마다 두 가지 시간 모두 상승)
            useEffect(() => {
                const usageTimer = setInterval(() => {
                    setStrips(prev => prev.map(strip => ({
                        ...strip,
                        ports: strip.ports.map(port => {
                            if (port.status === 'On') {
                                return { 
                                    ...port, 
                                    todayUsage: (port.todayUsage || 0) + 1, 
                                    continuousUsage: (port.continuousUsage || 0) + 1 
                                };
                            }
                            return port;
                        })
                    })));
                }, 60000);
                return () => clearInterval(usageTimer);
            }, []);

            // 3️⃣ ⏰ 스케줄 감시용 타이머 (5초마다 빠릿하게 시계 확인!)
            useEffect(() => {
                const scheduleTimer = setInterval(() => {
                    const now = new Date();
                    const currentMins = now.getHours() * 60 + now.getMinutes();

                    setStrips(prev => prev.map(strip => ({
                        ...strip,
                        ports: strip.ports.map(port => {
                            let targetStatus = port.status;

                            if (port.schedule?.active && port.type !== 'Always-on') {
                                const getMins = (h, m, pm) => {
                                    let hr = parseInt(h || '0', 10);
                                    if (pm === 'PM' && hr !== 12) hr += 12;
                                    if (pm === 'AM' && hr === 12) hr = 0;
                                    return hr * 60 + parseInt(m || '0', 10);
                                };

                                const sMins = getMins(port.schedule.startH, port.schedule.startM, port.schedule.startPM);
                                const eMins = getMins(port.schedule.endH, port.schedule.endM, port.schedule.endPM);

                                let shouldBeOn = false;
                                if (sMins <= eMins) {
                                    shouldBeOn = currentMins >= sMins && currentMins < eMins;
                                } else {
                                    shouldBeOn = currentMins >= sMins || currentMins < eMins;
                                }

                                const newTargetStatus = shouldBeOn ? 'On' : 'Off';

                                // 상태가 변해야 할 때만 백엔드에 즉각 신호 전송!
                                // 상태가 변해야 할 때만 백엔드에 즉각 신호 전송!
                                // 상태가 변해야 할 때만 백엔드에 즉각 신호 전송!
                                if (port.status !== newTargetStatus) {
                                    targetStatus = newTargetStatus;
                                    console.log(`[자동 스케줄 작동] ${port.name}의 전원을 ${newTargetStatus}(으)로 변경!`);
                                    
                                    fetch('https://smart-multitap-api.onrender.com/control', {
                                        method: 'POST',
                                        headers: { 'Content-Type': 'application/json' },
                                        body: JSON.stringify({ 
                                            device_id: strip.device_id, // 💡 [수정] 멀티탭 ID 추가!
                                            port_number: port.id, 
                                            is_on: shouldBeOn 
                                        })
                                    })
                                    .then(() => console.log(`[자동 스케줄] 포트 ${port.id} 서버 전송 완료!`))
                                    .catch(err => console.error(`[자동 스케줄] 에러 발생:`, err));
                                }

                            }
                            return { ...port, status: targetStatus };
                        })
                    })));
                }, 5000); // 💡 핵심: 5초(5000ms)마다 시계를 확인해서 오차를 줄입니다!

                return () => clearInterval(scheduleTimer);
            }, []);
            // 🟢 [완벽 교체] 외출 후 일반기기 방치 감시 타이머 (깨끗한 공백 버전)
            useEffect(() => {
                if (wifiConnected || !wifiDisconnectTime || showAwayAlert) return;

                const checkAwayNormalDevices = () => {
                    const timeParts = awayTime.match(/^(\d+)(m|h)$/);
                    let targetMs = 15 * 60 * 1000; 
                    
                    if (timeParts) {
                        const val = parseInt(timeParts[1], 10);
                        const unit = timeParts[2];
                        targetMs = unit === 'h' ? val * 60 * 60 * 1000 : val * 60 * 1000;
                    }

                    if (Date.now() - wifiDisconnectTime >= targetMs) {
                        let foundNormalPort = null;
                        let foundStripId = null;

                        for (const strip of strips) {
                            const port = strip.ports.find(p => p.type === 'Normal' && p.status === 'On');
                            if (port) {
                                foundNormalPort = port;
                                foundStripId = strip.id;
                                break;
                            }
                        }

                        if (foundNormalPort) {
                            setAlertDeviceInfo({
                                name: foundNormalPort.name,
                                portId: foundNormalPort.id,
                                stripId: foundStripId
                            });
                            setShowAwayAlert(true);
                        }
                    }
                };
                const alertTimer = setInterval(checkAwayNormalDevices, 2000);
                return () => clearInterval(alertTimer);
            }, [wifiConnected, wifiDisconnectTime, awayTime, strips, showAwayAlert]);
            return (
                <div className="app-container flex flex-col h-screen relative overflow-hidden">
                    <main className="flex-1 overflow-y-auto hide-scrollbar pb-24">
                        {activeTab === 'Home' && <HomePage strips={strips} setStrips={setStrips} t={t} setActiveTab={setActiveTab} language={language} logs={logs} addLog={addLog} setShowDetail={setShowDetail} featuredIds={featuredIds} setFeaturedIds={setFeaturedIds} esgData={esgData} stats={stats} />}
                        {activeTab === 'Ports' && <PortsPage strips={strips} setStrips={setStrips} t={t} aiRecommendations={aiRecommendations} language={language} apiData={apiData}/>}
                        {activeTab === 'Logs' && <SafetyLogPage t={t} language={language} logs={logs} />}
                        {activeTab === 'AI' && <AIAnalysisPage strips={strips} setStrips={setStrips} t={t} language={language} recommendations={aiRecommendations} />}
                        {activeTab === 'Energy' && <EnergyHubPage language={language} t={t} stats={stats} />}
                        {activeTab === 'Settings' && <SettingsPage language={language} setLanguage={setLanguage} wifiConnected={wifiConnected} setWifiConnected={setWifiConnected} currentSSID={currentSSID} awayTime={awayTime} setAwayTime={setAwayTime} t={t} onWifiChange={handleWifiChange} setCurrentSSID={setCurrentSSID} />}
                    </main>
                    <nav className="absolute bottom-0 left-0 right-0 bg-white/90 backdrop-blur-xl border-t border-gray-100 px-4 py-4 pb-8 flex justify-between items-center z-50">
                        <NavItem active={activeTab === 'Home'} label="Home" onClick={() => setActiveTab('Home')}><Icons.Home size={22} /></NavItem>
                        <NavItem active={activeTab === 'Ports'} label="Ports" onClick={() => setActiveTab('Ports')}><Icons.Plug size={22} /></NavItem>
                        <NavItem active={activeTab === 'AI'} label="AI" onClick={() => setActiveTab('AI')}><Icons.Sparkles size={22} /></NavItem>
                        <NavItem active={activeTab === 'Energy'} label="Energy" onClick={() => setActiveTab('Energy')}><Icons.Zap size={22} /></NavItem>
                        <NavItem active={activeTab === 'Settings'} label="Settings" onClick={() => setActiveTab('Settings')}><Icons.Settings size={22} /></NavItem>
                    </nav>
                    <EnergyReportModal isOpen={showDetail} onClose={() => setShowDetail(false)} language={language} />
                    {/* ✅ 진짜 외출 안심 모달 팝업창 */}
                    {showAwayAlert && (
                        <div className="absolute inset-0 z-[130] flex items-center justify-center p-6 bg-black/50 backdrop-blur-sm animate-in fade-in duration-300">
                            <MinimalCard className="w-full max-w-xs p-6 text-center shadow-2xl animate-in zoom-in-95 duration-300 border border-gray-100">
                                <div className="w-12 h-12 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto mb-4 animate-float">
                                    <Icons.AlertCircle size={24} />
                                </div>
                                <h3 className="text-lg font-black text-gray-900 mb-2">외출 안심 알림</h3>
                                <p className="text-xs text-gray-500 leading-relaxed mb-4">
                                    외출하신 것으로 판단됩니다.<br />
                                    현재 <span className="font-extrabold text-red-600">[{alertDeviceInfo?.name}]</span> 기기가 켜져 있습니다.<br />
                                    원격으로 차단하시겠습니까?
                                </p>
                                <div className="bg-red-50/50 p-2.5 rounded-xl mb-5 border border-red-100">
                                    <p className="text-center text-[10px] text-red-500 font-bold leading-tight">
                                        3분 안에 응답이 없을 시<br/>안전을 위해 자동으로 차단됩니다.
                                    </p>
                                </div>
                                <div className="flex gap-3">
                                    <button 
                                        onClick={() => {
                                            setShowAwayAlert(false);
                                            setWifiDisconnectTime(Date.now()); // 1분 뒤 다시 알림이 오도록 리셋
                                            addLog({ id: Date.now(), title: '외출 알림 보류', msg: '사용자가 전원 유지를 선택하여 알림을 보류했습니다.', time: '방금 전', type: 'info' });
                                        }}
                                        className="flex-1 py-3 rounded-xl text-xs font-bold bg-gray-100 text-gray-500 hover:bg-gray-200 transition-colors"
                                    >
                                        아니오
                                    </button>
                                    <button 
                                        onClick={() => {
                                            const targetStrip = strips.find(s => s.id === alertDeviceInfo?.stripId);
                                            
                                            // 실제 백엔드 서버 멀티탭 포트 원격 차단 명령 전송
                                            fetch('https://smart-multitap-api.onrender.com/control', {
                                                method: 'POST',
                                                headers: { 'Content-Type': 'application/json' },
                                                body: JSON.stringify({
                                                    device_id: targetStrip?.device_id,
                                                    port_number: alertDeviceInfo?.portId,
                                                    is_on: false
                                                })
                                            }).catch(console.error);

                                            // 프론트엔드 상태 변경 (Off)
                                            setStrips(prev => prev.map(strip => ({
                                                ...strip,
                                                ports: strip.ports.map(p => p.id === alertDeviceInfo?.portId ? { ...p, status: 'Off' } : p)
                                            })));

                                            setShowAwayAlert(false);
                                            addLog({ id: Date.now(), title: '외출 안심 차단 완료', msg: `요청에 따라 ${alertDeviceInfo?.name} 전원을 원격으로 안전하게 차단했습니다.`, time: '방금 전', type: 'success' });
                                        }}
                                        className="flex-1 py-3 rounded-xl text-xs font-bold bg-red-600 text-white hover:bg-red-700 transition-colors shadow-md"
                                    >
                                        차단
                                    </button>
                                </div>
                            </MinimalCard>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<SmartSafeApp />);
    </script>
</body>
</html>
